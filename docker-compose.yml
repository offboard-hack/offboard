services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: offboard
      POSTGRES_PASSWORD: offboard
      POSTGRES_DB: offboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "offboard", "-d", "offboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
